<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:repeating-linear-gradient(90deg,var(--rojo) 0 40px,var(--crema) 40px 80px);min-height:100vh;color:var(--txt);}
.wrap{max-width:480px;margin:0 auto;background:var(--crema);min-height:100vh;box-shadow:0 0 40px var(--sombra);}

.head{text-align:center;padding:34px 20px 16px;}
.head .mini{font-size:12px;letter-spacing:3px;color:var(--rojo);font-weight:700;text-transform:uppercase;}
.head h1{font-size:28px;color:var(--azul);text-transform:uppercase;letter-spacing:1px;text-shadow:2px 2px 0 var(--dorado);margin:6px 0;}
.pts-hero{background:var(--color);color:#fff;border-radius:20px;padding:18px;text-align:center;margin:0 20px 20px;box-shadow:0 6px 0 var(--sombra-color);}
.pts-hero .num{font-size:72px;font-weight:900;line-height:1;}
.pts-hero .lab{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.9;}
.panel{padding:0 20px 40px;}
.screen{display:none;animation:fade .4s ease both;}
.screen.on{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card{background:#fff;border:3px solid var(--dorado);border-radius:18px;padding:20px;box-shadow:0 6px 0 var(--dorado-osc);margin-bottom:16px;}
h2{text-align:center;color:var(--azul);font-size:20px;margin-bottom:8px;text-transform:uppercase;}
.lead{text-align:center;color:#6a584c;font-size:14px;margin-bottom:16px;line-height:1.4;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
.cat-btn{border:none;border-radius:14px;padding:14px 8px;cursor:pointer;color:#fff;font-family:var(--font);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;transition:transform .12s,box-shadow .12s;box-shadow:0 5px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:5px;}
.cat-btn:hover{transform:translateY(-3px);} .cat-btn:active{transform:translateY(2px);}
.cat-btn .ico{font-size:22px;}
.cat-p2t{background:#1B6CA8;} .cat-p2r{background:#0e4d7a;}
.cat-pack{background:#2E8B57;} .cat-stow{background:#D9A520;color:#1a1a1a;}
.cat-safety{background:#C8102E;} .cat-calidad{background:#5B2A86;} .cat-procesos{background:#B5451B;grid-column:span 2;}
.lang-bar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.lang-btn{border:2px solid var(--dorado);background:var(--crema);border-radius:20px;padding:5px 12px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.lang-btn.act{background:var(--azul);color:#fff;border-color:var(--azul);}
.badge-tag{display:inline-block;background:var(--color);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:30px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.pts-tag{text-align:center;font-size:13px;color:var(--azul);font-weight:700;margin-bottom:14px;}
.pts-tag b{color:var(--rojo);font-size:16px;}
.preg{font-size:17px;color:var(--azul);font-weight:800;line-height:1.3;margin-bottom:16px;text-align:center;}
.ops{display:flex;flex-direction:column;gap:10px;}
.op{background:var(--crema);border:2px solid var(--dorado);border-radius:12px;padding:12px 16px;font-family:var(--font);font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left;transition:all .12s;}
.op:hover{background:var(--dorado);}
.op.ok{background:var(--verde);color:#fff;border-color:var(--verde);}
.op.no{background:#d9534f;color:#fff;border-color:#d9534f;}
.op:disabled{cursor:default;}
.resico{font-size:60px;text-align:center;margin:4px 0 8px;}
.restit{text-align:center;font-size:24px;font-weight:800;text-transform:uppercase;margin-bottom:6px;}
.restit.win{color:var(--verde);} .restit.snack{color:var(--dorado-osc);}
.resmsg{text-align:center;font-size:15px;color:#6a584c;line-height:1.5;margin-bottom:8px;}
.premio{background:var(--dorado);border-radius:12px;padding:14px;text-align:center;font-size:16px;font-weight:800;color:var(--azul);margin:12px 0;}
.btn{display:block;width:100%;background:var(--azul);color:#fff;border:none;border-radius:14px;padding:14px;font-family:var(--font);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 0 #0e2342;transition:transform .1s;margin-bottom:8px;}
.btn:hover{transform:translateY(-2px);} .btn:active{transform:translateY(3px);}
.btn.sec{background:var(--color);box-shadow:0 5px 0 var(--sombra-color);}
.btn:disabled{background:#aaa;box-shadow:0 5px 0 #888;cursor:not-allowed;transform:none;}
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:99;opacity:.9;animation:caer linear forwards;}
@keyframes caer{to{transform:translateY(105vh) rotate(720deg);opacity:0;}}
.foot{text-align:center;font-size:11px;color:#b0a090;padding:0 20px 20px;line-height:1.5;}

.badge-field{border:3px solid var(--dorado);border-radius:12px;padding:14px 16px;font-family:var(--font);font-size:20px;font-weight:800;text-align:center;letter-spacing:3px;text-transform:uppercase;width:100%;color:var(--azul);background:#fff;outline:none;}
.badge-field:focus{border-color:var(--azul);}
.alert-box{border-radius:12px;padding:14px 16px;text-align:center;font-size:14px;font-weight:700;display:none;}
.alert-box.error{background:#fde8e8;color:#c0392b;border:2px solid #e74c3c;}
.alert-box.warn{background:#fff3cd;color:#856404;border:2px solid #ffc107;}
.alert-box.ok{background:#d4edda;color:#155724;border:2px solid #28a745;}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  const _fbApp = firebase.initializeApp({
    databaseURL: 'https://circo-peak-2026-default-rtdb.europe-west1.firebasedatabase.app'
  });
  const _fbDb = firebase.database();

  // Registros de jugadas (historial)
  const _fbRef = _fbDb.ref('registros');
  window._fbPush = (data) => _fbRef.push(data);

  // Participantes (control de acceso)
  const _fbPart = _fbDb.ref('participantes');

  // Leer participante por login (login = key en /participantes)
  window._fbGetParticipante = (login) => {
    return _fbPart.child(login).once('value').then(snap => snap.val());
  };

  // Actualizar participante tras jugar
  window._fbUpdateParticipante = (login, data) => {
    return _fbPart.child(login).update(data);
  };

  console.log('Firebase OK');
</script>

        ar: ["تجاهله والاستمرار في العمل لتجنب خفض الإنتاجية","حاول إصلاحه بنفسك حتى لو لم تعرف كيف","أنشئ Andon وأخبر مديرك ولا تكمل حتى تتلقى تعليمات","انتظر حتى يكتشفه زميل آخر"]
      }, c: 2
    }
  ]
};

const CAT_NAMES={P2T:"Pick to Tote",P2R:"Pick to Rebin",PACK:"Packing",STOW:"Stow",SAFETY:"Safety",CALIDAD:"Calidad",PROCESOS:"Procesos"};
const PTS_HUECO=10;
let pregActual=null, catActual=null, langActual='es', opcionesOrden=[];
let badgeActual = null;

function show(id){
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ── IDIOMA EN LOGIN ─────────────────────────────────────────────
const LOGIN_TEXTS = {
  es: { h2: '&#128100; Introduce tu login', lead: 'Escribe tu <b>User ID</b> (login de Amazon) para participar', btn: 'Continuar', placeholder: 'Ej: gontonic' },
  en: { h2: '&#128100; Enter your login',   lead: 'Type your <b>User ID</b> (Amazon login) to participate',    btn: 'Continue',  placeholder: 'e.g. gontonic' },
  ar: { h2: '&#128100; أدخل تسجيل دخولك',  lead: 'اكتب <b>معرف المستخدم</b> (تسجيل دخول أمازون) للمشاركة',  btn: 'متابعة',    placeholder: 'مثال: gontonic' }
};

const CAT_TEXTS = {
  es: { h2: 'Elige categoria', lead: 'En que proceso quieres demostrar tu conocimiento?' },
  en: { h2: 'Choose a category', lead: 'Which process do you want to show your knowledge in?' },
  ar: { h2: 'اختر فئة', lead: 'في أي عملية تريد إظهار معرفتك؟' }
};

const GLOBAL_TEXTS = {
  es: { pts_hero: 'PUNTOS POR ACERTAR', pts_tag: 'Puntos si aciertas: <b>10</b>', btn_sig: 'Siguiente participante', zona: 'LEÓN' },
  en: { pts_hero: 'POINTS FOR CORRECT ANSWER', pts_tag: 'Points if correct: <b>10</b>', btn_sig: 'Next participant', zona: 'LION' },
  ar: { pts_hero: 'نقاط عند الإجابة الصحيحة', pts_tag: 'النقاط عند الإجابة الصحيحة: <b>10</b>', btn_sig: 'المشارك التالي', zona: 'الأسد' }
};

function setLoginLang(lang){
  langActual = lang;
  ['es','en','ar'].forEach(l=>{
    document.getElementById('login-btn-'+l).classList.toggle('act', l===lang);
  });
  const t = LOGIN_TEXTS[lang];
  document.querySelector('#s-badge h2').innerHTML = t.h2;
  document.querySelector('#s-badge .lead').innerHTML = t.lead;
  document.getElementById('badge-btn').textContent = t.btn;
  document.getElementById('badge-input').placeholder = t.placeholder;
  document.getElementById('s-badge').style.direction = lang==='ar' ? 'rtl' : 'ltr';
  // Actualizar pantalla categorías
  const ct = CAT_TEXTS[lang];
  document.querySelector('#s-cat h2').innerHTML = ct.h2;
  document.querySelector('#s-cat .lead').innerHTML = ct.lead;
  document.getElementById('s-cat').style.direction = lang==='ar' ? 'rtl' : 'ltr';
  // Textos globales
  const g = GLOBAL_TEXTS[lang];
  document.getElementById('pts-hero-lab').textContent = g.pts_hero;
  document.getElementById('pts-tag-preg').innerHTML = g.pts_tag;
  document.getElementById('btn-siguiente').textContent = g.btn_sig;
  document.getElementById('titulo-zona').textContent = g.zona;
}

// ── LOGIN VERIFICATION ──────────────────────────────────────────
function verificarBadge(){
  const input = document.getElementById('badge-input');
  const login = input.value.trim().toLowerCase().replace(/\s/g,'');
  const alerta = document.getElementById('badge-alert');
  const btn = document.getElementById('badge-btn');

  if(!login || login.length < 2){
    mostrarAlerta(alerta, 'error', '&#9888; Introduce tu login de Amazon.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando...';
  alerta.style.display = 'none';

  const ALERT_TEXTS = {
    es: {
      no_reg:   '&#10060; Login no registrado. Pide al manager que escanee tu badge primero.',
      no_activ: '&#9888; Tu badge no ha sido activado todav&iacute;a. Pide al manager que escanee tu badge.',
      ya_jug:   '&#9203; Ya has participado. &iexcl;Suerte en el sorteo final!',
      ok:       '&#10003; Bienvenido/a <b>' + login + '</b>! Elige tu categor&iacute;a.',
      wifi:     '&#9888; Error de conexi&oacute;n. Comprueba el WiFi e int&eacute;ntalo de nuevo.'
    },
    en: {
      no_reg:   '&#10060; Login not registered. Ask the manager to scan your badge first.',
      no_activ: '&#9888; Your badge has not been activated yet. Ask the manager to scan your badge.',
      ya_jug:   '&#9203; You have already participated. Good luck in the final draw!',
      ok:       '&#10003; Welcome <b>' + login + '</b>! Choose your category.',
      wifi:     '&#9888; Connection error. Check the WiFi and try again.'
    },
    ar: {
      no_reg:   '&#10060; تسجيل الدخول غير مسجل. اطلب من المدير مسح شارتك أولاً.',
      no_activ: '&#9888; لم يتم تفعيل شارتك بعد. اطلب من المدير مسح شارتك.',
      ya_jug:   '&#9203; لقد شاركت بالفعل. حظاً موفقاً في السحب النهائي!',
      ok:       '&#10003; مرحباً <b>' + login + '</b>! اختر فئتك.',
      wifi:     '&#9888; خطأ في الاتصال. تحقق من WiFi وحاول مجدداً.'
    }
  };
  const at = ALERT_TEXTS[langActual] || ALERT_TEXTS.es;

  window._fbGetParticipante(login).then(data => {
    btn.disabled = false;
    btn.textContent = LOGIN_TEXTS[langActual].btn;

    if(!data){
      mostrarAlerta(alerta, 'error', at.no_reg);
      return;
    }

    if(!data.activo){
      mostrarAlerta(alerta, 'warn', at.no_activ);
      return;
    }

    if(data.participoEnPregunta){
      mostrarAlerta(alerta, 'warn', at.ya_jug);
      return;
    }

    // OK — puede jugar
    badgeActual = login;
    mostrarAlerta(alerta, 'ok', at.ok);
    setTimeout(() => { show('s-cat'); }, 1000);

  }).catch(err => {
    btn.disabled = false;
    btn.textContent = LOGIN_TEXTS[langActual].btn;
    mostrarAlerta(alerta, 'error', at.wifi);
    console.error('Firebase error:', err);
  });
}

function mostrarAlerta(el, tipo, msg){
  el.className = 'alert-box ' + tipo;
  el.innerHTML = msg;
  el.style.display = 'block';
}

// Permitir Enter en el campo de badge
document.getElementById('badge-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') verificarBadge();
});

// ── CATEGORIA ───────────────────────────────────────────────────
function elegirCat(cat){
  catActual = cat;
  const pool = PREG[cat];
  pregActual = pool[Math.floor(Math.random() * pool.length)];
  opcionesOrden = [];
  document.getElementById('preg-badge').textContent = CAT_NAMES[cat];
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('act'));
  document.getElementById('btn-' + langActual).classList.add('act');
  setLang(langActual);
  show('s-preg');
}

// ── PREGUNTA ────────────────────────────────────────────────────
function setLang(lang){
  langActual = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('act'));
  document.getElementById('btn-' + lang).classList.add('act');
  // Textos globales
  const g = GLOBAL_TEXTS[lang];
  document.getElementById('pts-hero-lab').textContent = g.pts_hero;
  document.getElementById('pts-tag-preg').innerHTML = g.pts_tag;
  document.getElementById('btn-siguiente').textContent = g.btn_sig;
  document.getElementById('titulo-zona').textContent = g.zona;
  if(!pregActual) return;
  document.getElementById('preg-txt').innerHTML = pregActual[lang];
  const cont = document.getElementById('preg-ops');
  if(opcionesOrden.length === 0){
    opcionesOrden = pregActual.op.es.map((_,i)=>i);
    for(let i=opcionesOrden.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [opcionesOrden[i],opcionesOrden[j]]=[opcionesOrden[j],opcionesOrden[i]];
    }
  }
  // Solo conservar estados si ya se respondió (hay algún botón ok o no)
  const yaRespondido = [...cont.querySelectorAll('.op')].some(b=>b.classList.contains('ok')||b.classList.contains('no'));
  const prevStates = {};
  if(yaRespondido){
    cont.querySelectorAll('.op').forEach((b,idx)=>{
      prevStates[idx]={ok:b.classList.contains('ok'),no:b.classList.contains('no'),disabled:b.disabled};
    });
  }
  cont.innerHTML = '';
  opcionesOrden.forEach((oi, idx)=>{
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = pregActual.op[lang][oi];
    if(yaRespondido && prevStates[idx]){
      if(prevStates[idx].ok) b.classList.add('ok');
      if(prevStates[idx].no) b.classList.add('no');
      if(prevStates[idx].disabled) b.disabled = true;
    }
    b.onclick = ()=>responder(b, oi===pregActual.c);
    cont.appendChild(b);
  });
}

// ── RESPUESTA ───────────────────────────────────────────────────
function responder(btn, correcta){
  document.querySelectorAll('#preg-ops .op').forEach(b=>b.disabled=true);
  if(correcta){
    btn.classList.add('ok');
    setTimeout(()=>resultado('win'), 650);
  } else {
    btn.classList.add('no');
    const ops = [...document.querySelectorAll('#preg-ops .op')];
    opcionesOrden.forEach((oi,idx)=>{ if(oi===pregActual.c) ops[idx].classList.add('ok'); });
    setTimeout(()=>resultado('snack'), 900);
  }
}

// ── RESULTADO + FIREBASE ─────────────────────────────────────────
function resultado(tipo){
  const now = new Date();
  const hora = now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const totalPts = tipo==='win' ? PTS_HUECO : 0;

  // 1. Guardar jugada en /registros
  const entrada = {
    badge: badgeActual,
    categoria: catActual,
    ptsTiro: PTS_HUECO,
    acerto: tipo==='win',
    totalPts: totalPts,
    hora: hora,
    ts: now.getTime(),
      satelite: 'EXTERIOR'
  };
  if(window._fbPush) window._fbPush(entrada);

  // 2. Actualizar participante — marcar como jugado
  if(window._fbUpdateParticipante && badgeActual){
    window._fbUpdateParticipante(badgeActual, {
      participoEnPregunta: true,
      acerto: tipo==='win',
      totalPts: totalPts,
      categoria: catActual,
      satelite: 'EXTERIOR',
      horaJuego: hora,
      tsJuego: now.getTime()
    });
  }

  const ico = document.getElementById('res-ico');
  const tit = document.getElementById('res-tit');
  const msg = document.getElementById('res-msg');
  const pr  = document.getElementById('res-premio');

  tit.className = 'restit ' + (tipo==='win' ? 'win' : 'snack');

  const RES_TEXTS = {
    es: {
      win_tit: '¡Al sorteo final!',
      win_msg: '¡Puntería y conocimiento! Sumaste <b>' + totalPts + ' puntos</b>.',
      win_pr:  '&#127903; ENTRAS EN EL SORTEO FINAL',
      fail_tit: '¡Gracias por jugar!',
      fail_msg: 'Esperamos que te guste nuestro detalle.',
      fail_pr:  '&#127873; SNACK / DETALLE POR PARTICIPAR'
    },
    en: {
      win_tit: 'Into the final draw!',
      win_msg: 'Great aim and knowledge! You earned <b>' + totalPts + ' points</b>.',
      win_pr:  '&#127903; YOU ENTER THE FINAL DRAW',
      fail_tit: 'Thanks for playing!',
      fail_msg: 'We hope you enjoy our little gift.',
      fail_pr:  '&#127873; SNACK / GIFT FOR PARTICIPATING'
    },
    ar: {
      win_tit: 'إلى السحب النهائي!',
      win_msg: 'إصابة ومعرفة! حصلت على <b>' + totalPts + ' نقطة</b>.',
      win_pr:  '&#127903; تدخل السحب النهائي',
      fail_tit: 'شكراً على المشاركة!',
      fail_msg: 'نأمل أن يعجبك هديتنا الصغيرة.',
      fail_pr:  '&#127873; وجبة خفيفة / هدية للمشاركة'
    }
  };

  const rt = RES_TEXTS[langActual] || RES_TEXTS.es;
  document.getElementById('s-res').style.direction = langActual === 'ar' ? 'rtl' : 'ltr';

  if(tipo==='win'){
    confeti();
    ico.innerHTML = '&#127881;';
    tit.textContent = rt.win_tit;
    msg.innerHTML = rt.win_msg;
    pr.innerHTML = rt.win_pr;
  } else {
    ico.innerHTML = '&#127852;';
    tit.textContent = rt.fail_tit;
    msg.innerHTML = rt.fail_msg;
    pr.innerHTML = rt.fail_pr;
  }
  show('s-res');
}

// ── REINICIAR ────────────────────────────────────────────────────
function reiniciar(){
  pregActual = null;
  catActual = null;
  opcionesOrden = [];
  langActual = 'es';
  badgeActual = null;
  // Limpiar campo badge y alerta
  document.getElementById('badge-input').value = '';
  const alerta = document.getElementById('badge-alert');
  alerta.style.display = 'none';
  alerta.className = 'alert-box';
  // Limpiar botones de pregunta del participante anterior
  document.getElementById('preg-ops').innerHTML = '';
  document.getElementById('preg-txt').innerHTML = '';
  show('s-badge');
}

// ── CONFETTI ─────────────────────────────────────────────────────
function confeti(){
  const cols=['#C8102E','#F2C14E','#1B3A6B','#2E8B57','#5B2A86'];
  for(let i=0;i<50;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2)+'s';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4500);
  }
}
